<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Map - ITCU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <!-- PDF.js library -->
<script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: Arial, sans-serif; background-color: #c8e6f5; overflow: hidden; }

    /* ===== BUTTON CONTAINER ===== */
    #topButtons {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px; /* equal spacing between buttons */
      z-index: 1001;
    }

    /* ===== INDIVIDUAL BUTTONS ===== */
    .map-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: all 0.25s ease;
      display: none; /* hidden until map loads */
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }
    .map-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .button-icon { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== COLORS ===== */
    #homeBtn {
      background-color: #4CAF50; /* green */
    }
    #homeBtn:hover { background-color: #3e8e41; }

    #unescoBtn {
      background-color: #9C27B0; /* purple */
    }
    #unescoBtn:hover { background-color: #7B1FA2; }

    #playBtn {
      background-color: #2196F3; /* blue */
    }
    #playBtn:hover { background-color: #1976D2; }

#unescoOverlay {
  opacity: 0;
  transition: opacity 0.3s ease;
}
#unescoOverlay[style*="display: flex"] {
  opacity: 1;
}



    /* ===== LANDING PAGE ===== */
    .landing {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      cursor: pointer;
      overflow: hidden;
      z-index: 1000;
    }

    .landing::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      transform: translate(-50%, -50%);

      z-index: -1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
    }

    .landing-content {
      position: relative;
      text-align: center;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .landing-content img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-aspect-ratio: 16/9) {
      .landing::before { width: 177.78vh; height: 100vh; }
    }

    /* ===== MAP SECTION ===== */
    #map { height: 100%; width: 100%; display: none; background-color: #c8e6f5; }

    .popup-content { font-size: 14px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; }
    th { background-color: #f4f4f4; }
    .popup-content h3 { margin-bottom: 6px; color: #007bff; }

    .leaflet-control-fullscreen {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      color: white;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .leaflet-control-fullscreen svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .leaflet-control-fullscreen:hover { background: rgba(0,0,0,0.8); }

    /* ===== GAME SECTION ===== */
    #game-section {
      display: none;
      background: #f0f4f8;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(23, 37, 84, 0.15);
      width: min(560px, calc(100vw - 32px));
      text-align: center;
    }
    #question-text { color: #172554; font-size: 1.45rem; line-height: 1.35; margin-bottom: 20px; }
    #options { display: grid; gap: 10px; }
    .option {
      display: block;
      width: 100%;
      background: #f1f5f9;
      border: 2px solid #dbe4f0;
      color: #1e293b;
      margin: 0;
      padding: 13px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .option:hover:not(:disabled) { background: #e0eaff; border-color: #93b4ff; transform: translateY(-1px); }
    .option:disabled { cursor: default; opacity: 1; }
    .option.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .option.incorrect { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .hidden { display: none; }
    .result { font-weight: bold; font-size: 20px; margin-top: 20px; color: #172554; }
    #answer-feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; text-align: left; line-height: 1.5; }
    #answer-feedback.feedback-correct { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    #answer-feedback.feedback-incorrect { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .game-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .back-button {
      margin-top: 0;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .back-button:hover { background: #4338ca; }
    .next-button { background: #2563eb; color: white; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .next-button:hover { background: #1d4ed8; }
    @media (max-width: 560px) {
      #topButtons { top: 8px; right: 8px; left: 8px; justify-content: flex-end; gap: 6px; }
      .map-btn { padding: 9px 10px; font-size: 12px; }
      .map-btn .button-label { display: none; }
      .button-icon { width: 20px; height: 20px; }
      .game-container { padding: 22px 18px; }
    }
  </style>
</head>

<script>
    const landing = document.getElementById("landing");
    const mapDiv = document.getElementById("map");
    const topButtons = document.getElementById("topButtons");
    const homeBtn = document.getElementById("homeBtn");
    const playBtn = document.getElementById("playBtn");

    // ===== MAP INITIALIZATION =====
    const map = L.map('map', { worldCopyJump: false, noWrap: true, minZoom: 2, maxZoom: 6 }).setView([20, 0], 3);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      minZoom: 2,
      maxZoom: 6,
      noWrap: true,
      attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> and its data providers'
    }).addTo(map);


    landing.addEventListener("click", () => {
      landing.style.display = "none";
      mapDiv.style.display = "block";
      topButtons.querySelectorAll(".map-btn").forEach(btn => btn.style.display = "inline-flex");
      map.invalidateSize();
    });

    homeBtn.addEventListener("click", () => {
      landing.style.display = "flex";
      mapDiv.style.display = "none";
      topButtons.querySelectorAll(".map-btn").forEach(btn => btn.style.display = "none");
    });

    const countryData2026 = JSON.parse(document.getElementById("country-data-2026-inline").textContent).countries;
    const countryDataReady = Promise.resolve(countryData2026);

   async function showPopup(feature, latlng) {
  await countryDataReady;
  const name = feature.properties.name;
  const info = shortInfo[name] || {};
  const currentData = countryData2026[name] || {};

  let html = `<div class='popup-content'><h3>${name}</h3>`;

  /* ===== CAPITAL & DETAIL ===== */
  if (info.capital) {
    html += `<b>Capital:</b> ${info.capital}<br>`;
  }
  if (info.detail && !currentData.jointResearch?.length && !currentData.jointScholarships?.length) {
    html += `<b>Details:</b> ${info.detail}<br><br>`;
  }

  /* =====  (e.g., Philippines) ===== */
  if (info.impact && info.impact.length > 0) {
    html += `<b>Overview: Multilateral Engagements</b> <div style="max-height:350px; overflow-y:auto; margin-bottom:10px;">${info.impact}<br><br>`;
  }
    if (info.multilateral && info.multilateral.length > 0) {
    html += `<b>Overview: Impact Assessment</b> <div style="max-height:350px; overflow-y:auto; margin-bottom:10px;">${info.multilateral}<br><br>`;
  }
     

  /* ===== NOTES TABLE ===== */
  if (info.note && info.note.length > 0 && !currentData.jointScholarships?.length) {
    html += `
      <b>Scholars:</b>
      <table>
        <tr><th>No. of Students</th><th>Status</th><th>Level</th></tr>
    `;
    info.note.forEach(([a, b, c]) => {
      html += `<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`;
    });
    html += `</table><br>`;
  }

  /* ===== AREA TABLE ===== */
  if (info.area && info.area.length > 0 && !currentData.jointResearch?.length) {
    html += `
      <b>Areas of Collaboration:</b>
      <table>
        <tr><th>Area of Study</th><th>No. of Projects</th></tr>
    `;
    info.area.forEach(([a, b]) => {
      html += `<tr><td>${a}</td><td>${b}</td></tr>`;
    });
    html += `</table><br>`;
  }

  /* ===== UNIVERSITY LIST ===== */
  if (info.univ && info.univ.length > 0) {
    html += `<b>Partner Universities:</b><ul>`;
    info.univ.forEach(([u]) => {
      html += `<li>${u}</li>`;
    });
    html += `</ul><br>`;
  }

  /* ===== CLM TABLE (Cambodia, Laos, Myanmar) ===== */
  if (info.clm && info.clm.length > 0) {
    html += `
      <b>CLM Program Partner Universities:</b>
      <table>
        <tr><th>University</th><th>Programs</th></tr>
    `;
    info.clm.forEach(([uni, programs]) => {
      html += `<tr><td>${uni}</td><td>${programs}</td></tr>`;
    });
    html += `</table><br>`;
  }

  const safe = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  if (currentData.jointResearch && currentData.jointResearch.length) {
    html += '<h3>2026 Joint Research Projects</h3>';
    currentData.jointResearch.forEach(item => {
      html += '<table class="country-data-table"><tbody>';
      html += `<tr><th>Details</th><td>${safe(item.details || '')}</td></tr>`;
      html += `<tr><th>Areas</th><td>${(item.topAreas || []).map(area => `<div>${safe(area)}</div>`).join('')}</td></tr>`;
      html += `<tr><th>No. of Projects</th><td>${item.projects == null ? 'Not provided' : safe(item.projects)}</td></tr>`;
      html += '</tbody></table>';
    });
  }
  if (currentData.jointScholarships && currentData.jointScholarships.length) {
    html += '<h3>2026 Joint Scholarship Programs</h3>';
    currentData.jointScholarships.forEach(item => {
      html += '<table class="country-data-table"><tbody>';
      html += `<tr><th>Details</th><td>${safe(item.details || '')}</td></tr>`;
      html += `<tr><th>Top Courses Taken</th><td>${(item.topCourses || []).map(course => `<div>${safe(course)}</div>`).join('')}</td></tr>`;
      html += `<tr><th>No. of Scholars</th><td>${item.scholars == null ? 'Not provided' : safe(item.scholars)}${item.countLabel ? ` (${safe(item.countLabel)})` : ''}</td></tr>`;
      html += '</tbody></table>';
    });
  }

  html += `</div>`;

  L.popup({ maxWidth: 350 })
    .setLatLng(latlng)
    .setContent(html)
    .openOn(map);
}

fullscreenControl.onAdd = function () {

  div.type = "button";
  const expandIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>';
  const exitIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5H3m13-5v5h5M3 16h5v5m13-5h-5v5"/></svg>';
  div.innerHTML = expandIcon;
  div.title = "Toggle fullscreen";
  div.setAttribute("aria-label", "Enter fullscreen");
  L.DomEvent.disableClickPropagation(div);

  div.onclick = function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().then(() => {
        div.innerHTML = exitIcon;
        div.setAttribute("aria-label", "Exit fullscreen");
      }).catch(error => console.error("Could not enter fullscreen:", error));

      document.exitFullscreen().then(() => {
        div.innerHTML = expandIcon;
        div.setAttribute("aria-label", "Enter fullscreen");
      }).catch(error => console.error("Could not exit fullscreen:", error));
    }
  };

  return div;

    // ===== GAME SECTION LOGIC =====
    const gameSection = document.getElementById("game-section");
    const backBtn = document.getElementById("back-btn");
    const nextQuestionBtn = document.getElementById("next-question");
    const resultDiv = document.getElementById("result");
    const answerFeedback = document.getElementById("answer-feedback");
    let selectedQuestions = [], current = 0, score = 0;

    function shuffled(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function makeChoices(answer, distractors) {
      const choices = shuffled([String(answer), ...shuffled([...new Set(distractors.map(String).filter(value => value !== String(answer)))])]
        .slice(0, 4));
      return { options: choices, correct: choices.indexOf(String(answer)) };
    }

    function buildDataQuestions(data) {
      const questions = [];
      const countFacts = [];
      const topicFacts = [];
      const seenCounts = new Set();

      Object.entries(data).forEach(([country, record]) => {
        (record.jointResearch || []).forEach(item => {
          if (item.projects != null) {
            countFacts.push({label: `${country} joint research projects`, value: item.projects, country, kind: 'research'});
          }
          (item.topAreas || []).forEach(topic => topicFacts.push({country, topic, kind: 'research'}));
        });
        (record.jointScholarships || []).forEach(item => {
          if (item.scholars != null) {
            const label = item.countLabel || `${country} joint scholarship program`;
            const key = `${label}:${item.scholars}`;
            if (!seenCounts.has(key)) {
              seenCounts.add(key);
              countFacts.push({label, countLabel: item.countLabel, value: item.scholars, country, kind: 'scholarship'});
            }
          }
          (item.topCourses || []).forEach(topic => topicFacts.push({country, topic, kind: 'scholarship'}));
        });
      });

      countFacts.forEach(fact => {
        const label = fact.label.replace(/^Scholars \(/, '');
        const distractors = countFacts.filter(other => other.value !== fact.value).map(other => other.value);
        const choices = makeChoices(fact.value, distractors);
        const subject = fact.countLabel ? 'the ASEAN CLM scholarship program' : fact.country;
        const unit = fact.kind === 'research' ? 'projects' : 'scholars';
        questions.push({
          question: `How many ${unit} are reported for ${subject}?`,
          explanation: `The 2026 data lists ${fact.value} ${unit} for ${subject}.`,
          ...choices
        });
      });

      topicFacts.forEach(fact => {
        const countryChoices = makeChoices(fact.country, Object.keys(data).filter(country => country !== fact.country));
        questions.push({
          question: `Which partner lists ${fact.topic} under ${fact.kind === 'research' ? 'research areas' : 'scholarship courses'}?`,
          explanation: `${fact.country} lists ${fact.topic} under ${fact.kind === 'research' ? 'Areas' : 'Top Courses Taken'} in the 2026 data.`,
          ...countryChoices
        });
      });

      return questions.filter(question => question.options.length === 4);
    }

    function getRandomQuestions(questionPool) {
      return shuffled(questionPool).slice(0, 3);
    }

    function showQuestion() {
      const q = selectedQuestions[current];
      document.getElementById("question-text").textContent = `Q${current + 1}. ${q.question}`;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      answerFeedback.textContent = "";
      answerFeedback.className = "hidden";
      nextQuestionBtn.classList.add("hidden");
      resultDiv.classList.add("hidden");
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
        btn.className = "option";
        btn.onclick = () => checkAnswer(i);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      if (!nextQuestionBtn.classList.contains("hidden")) return;
      const q = selectedQuestions[current];
      const isCorrect = selected === q.correct;
      if (isCorrect) score++;
      const optionButtons = [...document.querySelectorAll("#options .option")];
      optionButtons.forEach((button, index) => {
        button.disabled = true;
        if (index === q.correct) button.classList.add("correct");
        else if (index === selected) button.classList.add("incorrect");
      });
      answerFeedback.textContent = `${isCorrect ? "Correct!" : `Not quite. The correct answer is: ${q.options[q.correct]}.`} ${q.explanation}`;
      answerFeedback.className = `feedback-${isCorrect ? "correct" : "incorrect"}`;
      nextQuestionBtn.textContent = current + 1 < selectedQuestions.length ? "Next Question" : "See Results";
      nextQuestionBtn.classList.remove("hidden");
    }

    nextQuestionBtn.addEventListener("click", () => {
      current++;
      if (current < selectedQuestions.length) showQuestion();
      else endGame();
    });

    function endGame() {
      document.getElementById("question-text").textContent = "Game Over!";
      document.getElementById("options").innerHTML = "";
      answerFeedback.className = "hidden";
      nextQuestionBtn.classList.add("hidden");
      resultDiv.textContent = `Your score: ${score} / ${selectedQuestions.length}`;
      resultDiv.classList.remove("hidden");
      backBtn.classList.remove("hidden");
      backBtn.onclick = () => {
        mapDiv.style.display = "block";
        gameSection.style.display = "none";
        map.invalidateSize();
        resultDiv.classList.add("hidden");
        backBtn.classList.add("hidden");
        nextQuestionBtn.classList.add("hidden");
      };
    }

    playBtn.addEventListener("click", async () => {
      mapDiv.style.display = "none";
      gameSection.style.display = "flex";
      document.getElementById("question-text").textContent = "Loading quiz...";
      document.getElementById("options").innerHTML = "";
      answerFeedback.className = "hidden";
      resultDiv.classList.add("hidden");
      backBtn.classList.add("hidden");
      nextQuestionBtn.classList.add("hidden");
      const questionPool = buildDataQuestions(await countryDataReady);
      if (questionPool.length < 3) {
        document.getElementById("question-text").textContent = "Quiz data could not be loaded. Return to the map and try again.";
        backBtn.classList.remove("hidden");
        backBtn.onclick = () => {
          mapDiv.style.display = "block";
          gameSection.style.display = "none";
          map.invalidateSize();
          backBtn.classList.add("hidden");
        };
        return;
      }
      selectedQuestions = getRandomQuestions(questionPool);
      current = 0; score = 0;
      showQuestion();
    });
  </script>
